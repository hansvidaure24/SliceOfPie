name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The OCR models (~13 MB) are pinned by hash, so they only download when that list changes
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: public/ocr
          key: ocr-${{ hashFiles('src/scan/ocr-assets.json', 'scripts/fetch-ocr-assets.mjs') }}

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (phone and desktop)
        run: npm run test:e2e

      # Fails the build if any Lighthouse score drops below the floor in lighthouserc.json
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
